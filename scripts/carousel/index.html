<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UBBW 2026 Carousel Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800&family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,600;1,700;1,800&family=JetBrains+Mono:wght@500;700;800&family=Geologica:wght@600;700;800&family=Manrope:wght@500;600;700;800&family=Rubik:wght@600;700;800;900&display=block" rel="stylesheet" crossorigin="anonymous">
<style>
/* ───────────────────────── editor chrome ───────────────────────── */
:root { --ui-bg: #070b22; --ui-panel: #0d1333; --ui-line: rgba(255,255,255,.1); --ui-fg: #e9ecff; --ui-mut: rgba(233,236,255,.6); --ui-acc: #01fe6d; --ui-blue: #2945d5; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--ui-bg); color: var(--ui-fg); font: 13px/1.45 Montserrat, system-ui, sans-serif; display: grid; grid-template-rows: auto auto 1fr; overflow: hidden; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 10px 16px; border-bottom: 1px solid var(--ui-line); background: var(--ui-panel); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.01em; font-size: 14px; }
.brand i { width: 14px; height: 14px; background: var(--ui-acc); display: inline-block; }
.grp { display: flex; align-items: center; gap: 8px; }
.grp > span { color: var(--ui-mut); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--ui-line); border-radius: 6px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 6px 11px; color: var(--ui-mut); font-weight: 600; }
.seg button + button { border-left: 1px solid var(--ui-line); }
.seg button.on { background: var(--ui-blue); color: #fff; }
.btn-ui { background: rgba(255,255,255,.06); border: 1px solid var(--ui-line); border-radius: 6px; padding: 6px 12px; font-weight: 600; }
.btn-ui:hover { background: rgba(255,255,255,.12); }
.btn-ui.go { background: var(--ui-acc); color: #010d58; border-color: var(--ui-acc); }
.btn-ui:disabled { opacity: .45; cursor: progress; }
.sp { flex: 1; }
.pill { border: 1px solid var(--ui-line); border-radius: 6px; padding: 6px 11px; font-weight: 600; color: var(--ui-fg); }
.srv { float: right; text-transform: none; letter-spacing: 0; font-weight: 600; color: var(--ui-acc); }
.srv.bad { color: #ff9ad0; }
.warn { background: rgba(232,27,254,.14); color: #f6b4ff; padding: 6px 16px; font-size: 12px; border-bottom: 1px solid var(--ui-line); display: none; }
.warn.show { display: block; }
.main { display: grid; grid-template-columns: 290px minmax(0, 1fr) 380px; min-height: 0; }
.panel { overflow: auto; padding: 14px; border-right: 1px solid var(--ui-line); background: var(--ui-panel); }
.panel.right { border-right: 0; border-left: 1px solid var(--ui-line); }
.panel h3 { margin: 18px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--ui-mut); font-weight: 700; }
.panel h3:first-child { margin-top: 0; }
.row-ui { display: flex; gap: 6px; align-items: center; }
.row-ui > select, .row-ui > input { flex: 1; min-width: 0; }
select, .inp { background: rgba(255,255,255,.05); border: 1px solid var(--ui-line); border-radius: 6px; padding: 7px 9px; width: 100%; }
select option { background: #0d1333; }
textarea.inp { resize: vertical; min-height: 38px; }
.inp:focus, select:focus { outline: 2px solid var(--ui-blue); outline-offset: -1px; }
.list { display: flex; flex-direction: column; gap: 4px; }
.li { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 8px; border: 1px solid var(--ui-line); border-radius: 6px; cursor: pointer; }
.li.on { border-color: var(--ui-acc); background: rgba(1,254,109,.06); }
.li .n { font-family: "JetBrains Mono", monospace; color: var(--ui-mut); font-size: 11px; }
.li .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li .t small { color: var(--ui-mut); display: block; font-size: 11px; }
.li.over .n { color: #f6b4ff; }
.ic { background: none; border: 0; color: var(--ui-mut); padding: 2px 4px; border-radius: 4px; font-size: 13px; line-height: 1; }
.ic:hover { color: #fff; background: rgba(255,255,255,.1); }
.fld { margin-bottom: 12px; }
.fld > label { display: block; font-weight: 700; font-size: 12px; margin-bottom: 5px; }
.pair { display: grid; gap: 5px; }
.pair > div { position: relative; }
.pair .tag { position: absolute; right: 6px; top: 6px; font: 600 9px "JetBrains Mono", monospace; color: var(--ui-mut); pointer-events: none; }
.hint { color: var(--ui-mut); font-size: 11px; margin: -4px 0 12px; }
.item { border: 1px solid var(--ui-line); border-radius: 8px; padding: 10px; margin-bottom: 8px; background: rgba(255,255,255,.02); }
.item-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-weight: 700; font-size: 12px; }
.item .fld { margin-bottom: 8px; }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-top: 8px; }
.thumbs button { padding: 0; border: 2px solid transparent; border-radius: 5px; overflow: hidden; aspect-ratio: 1; background: #000; }
.thumbs button.on { border-color: var(--ui-acc); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
details summary { cursor: pointer; color: var(--ui-mut); font-weight: 600; }
.count-ui { font: 500 11px "JetBrains Mono", monospace; color: var(--ui-mut); text-align: right; margin-top: 3px; }
.count-ui.bad { color: #ff7ab8; }
.stage { overflow: auto; padding: 22px 24px 40px; min-width: 0; position: relative; }
.strip { display: flex; gap: 18px; align-items: flex-start; width: max-content; }
.seamless .strip { gap: 0; }
.frame { flex: none; position: relative; cursor: pointer; }
.frame::after { content: ""; position: absolute; inset: -5px; border: 2px solid transparent; border-radius: 4px; pointer-events: none; }
.frame.sel::after { border-color: var(--ui-acc); }
.seamless .frame::after { inset: 0; }
.frame .slide { position: absolute; top: 0; left: 0; transform-origin: 0 0; transform: scale(var(--z)); }
.cap { font: 500 11px "JetBrains Mono", monospace; color: var(--ui-mut); margin-top: 8px; position: absolute; top: 100%; left: 0; white-space: nowrap; }
.seamless .cap { display: none; }
.busy { position: fixed; inset: auto 16px 16px auto; background: var(--ui-blue); color: #fff; padding: 10px 14px; border-radius: 8px; font-weight: 700; display: none; z-index: 10; }
.busy.show { display: block; }
#exportRoot { position: fixed; left: -100000px; top: 0; }
@media (max-width: 1100px) {
  body { overflow: auto; display: block; }
  .main { grid-template-columns: 1fr; }
  .panel { border: 0; border-bottom: 1px solid var(--ui-line); max-height: none; }
  .stage { min-height: 60vh; }
}

/* ───────────────────────── slides ─────────────────────────
   Every size is in --u (1080-px design unit) so one layout serves 1080×1350, 1080×1080 and 1600×900.
   Text sizes use --f = --u × --k; --k shrinks per slide until the copy fits. */
.slide {
  --f: calc(var(--u) * var(--k));
  --c-cyan: #13effd; --c-green: #01fe6d; --c-lime: #c6fc1f; --c-magenta: #e81bfe; --c-violet: #9a4cf4; --c-blue: #2945d5; --c-white: #fff;
  position: relative; width: var(--w); height: var(--h); overflow: hidden; isolation: isolate;
  background: var(--bg); color: var(--fg); font-family: Montserrat, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
}
.slide * { box-sizing: border-box; margin: 0; }
.th-navy  { --bg: #010d58; --bgr: 1,13,88;  --fg: #fff; --mut: rgba(255,255,255,.72); --line: rgba(255,255,255,.16); --card: rgba(255,255,255,.06); --acc: #01fe6d; --acc2: #13effd; --chip: #2945d5; --chipfg: #fff; --btn: #01fe6d; --btnfg: #010d58; --grid: rgba(255,255,255,.07); --glow: rgba(41,69,213,.75); }
.th-night { --bg: #04071c; --bgr: 4,7,28;   --fg: #fff; --mut: rgba(255,255,255,.7);  --line: rgba(255,255,255,.14); --card: rgba(255,255,255,.05); --acc: #01fe6d; --acc2: #13effd; --chip: #2945d5; --chipfg: #fff; --btn: #01fe6d; --btnfg: #04071c; --grid: rgba(255,255,255,.06); --glow: rgba(41,69,213,.5); }
.th-paper { --bg: #f2f4fb; --bgr: 242,244,251; --fg: #010d58; --mut: rgba(1,13,88,.7); --line: rgba(1,13,88,.16); --card: #fff; --acc: #2945d5; --acc2: #2945d5; --chip: #010d58; --chipfg: #fff; --btn: #010d58; --btnfg: #01fe6d; --grid: rgba(1,13,88,.07); --glow: rgba(41,69,213,.16); }
.th-volt  { --bg: #01fe6d; --bgr: 1,254,109; --fg: #010d58; --mut: rgba(1,13,88,.78); --line: rgba(1,13,88,.2); --card: rgba(1,13,88,.07); --acc: #2945d5; --acc2: #010d58; --chip: #010d58; --chipfg: #01fe6d; --btn: #010d58; --btnfg: #01fe6d; --grid: rgba(1,13,88,.09); --glow: rgba(255,255,255,.55); }

.s-glow, .s-seam { position: absolute; top: 0; height: 100%; pointer-events: none; }
.s-glow { z-index: -2; }
.s-grid { position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: calc(var(--u) * 54) calc(var(--u) * 54);
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 16%, #000 84%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 16%, #000 84%, transparent 100%); }
.s-seam { z-index: 1; }
.s-seam i { position: absolute; display: block; }
.ph { position: absolute; z-index: 0; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph-full { inset: 0; }
.ph-full::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(var(--bgr), .55) 0%, rgba(var(--bgr), 0) 26%, rgba(var(--bgr), .35) 48%, rgba(var(--bgr), .92) 74%, rgb(var(--bgr)) 100%); }
.land .ph-full::after { background: linear-gradient(90deg, rgb(var(--bgr)) 0%, rgba(var(--bgr), .9) 34%, rgba(var(--bgr), .25) 70%, rgba(var(--bgr), .1) 100%); }
.ph-dim { inset: 0; opacity: .2; filter: grayscale(.5); }
.ph-inset { left: calc(var(--u) * 88); right: calc(var(--u) * 88); top: calc(var(--u) * 150); height: calc(var(--h) * .4); border-radius: calc(var(--u) * 6); }
.sq .ph-inset { height: calc(var(--h) * .34); }
.land .ph-inset { left: auto; right: 0; top: 0; bottom: 0; height: auto; width: 42%; border-radius: 0; }
.has-inset .s-body { top: calc(var(--u) * 196 + var(--h) * .4); }
.sq.has-inset .s-body { top: calc(var(--u) * 196 + var(--h) * .34); }
.land.has-inset .s-body { top: calc(var(--u) * 168); }
.land.has-inset .s-body, .land.has-inset .s-top, .land.has-inset .s-foot { right: calc(var(--w) * .42 + var(--u) * 64); }

.s-top { position: absolute; z-index: 2; top: calc(var(--u) * 64); left: calc(var(--u) * 88); right: calc(var(--u) * 88); display: flex; align-items: center; gap: calc(var(--u) * 16); }
.s-top img { height: calc(var(--u) * 50); display: block; }
.s-top .yr { font-weight: 500; font-size: calc(var(--u) * 24); letter-spacing: .06em; padding: calc(var(--u) * 2) calc(var(--u) * 10) calc(var(--u) * 4); border-left: calc(var(--u) * 3) solid var(--fg); background: linear-gradient(90deg, transparent, var(--line)); }
.s-top .no { margin-left: auto; font: 700 calc(var(--u) * 22) "JetBrains Mono", monospace; letter-spacing: .12em; color: var(--mut); }
.s-top .no b { color: var(--fg); }
.s-foot { position: absolute; z-index: 2; bottom: calc(var(--u) * 58); left: calc(var(--u) * 88); right: calc(var(--u) * 88); display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 20);
  font: 500 calc(var(--u) * 21) "JetBrains Mono", monospace; letter-spacing: .08em; color: var(--mut); }
.s-foot .swipe { color: var(--acc); font-weight: 700; text-transform: uppercase; display: inline-flex; align-items: center; gap: calc(var(--u) * 12); }
.s-foot .swipe svg { width: calc(var(--u) * 34); height: calc(var(--u) * 34); }

.s-body { position: absolute; z-index: 2; left: calc(var(--u) * 88); right: calc(var(--u) * 88); top: calc(var(--u) * 168); bottom: calc(var(--u) * 132);
  display: flex; flex-direction: column; justify-content: center; gap: calc(var(--u) * 26); overflow: hidden; }
.eyebrow { font: 700 calc(var(--f) * 23) "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--acc2); display: flex; align-items: center; gap: calc(var(--u) * 14); }
.eyebrow::before { content: ""; width: calc(var(--u) * 18); height: calc(var(--u) * 18); background: var(--acc); flex: none; }
.h1 { font-weight: 800; font-size: calc(var(--f) * 122); line-height: .98; letter-spacing: -.035em; overflow-wrap: break-word; }
.h2 { font-weight: 800; font-size: calc(var(--f) * 80); line-height: 1.02; letter-spacing: -.03em; overflow-wrap: break-word; }
.lead { font-size: calc(var(--f) * 34); line-height: 1.35; color: var(--mut); font-weight: 500; }
.quote { font-weight: 700; font-size: calc(var(--f) * 66); line-height: 1.12; letter-spacing: -.02em; }
.text { font-size: calc(var(--f) * 30); line-height: 1.45; color: var(--mut); font-weight: 500; }
.acc { color: var(--acc); }
.alt { display: block; font-size: .42em; line-height: 1.25; letter-spacing: -.005em; font-weight: 600; color: var(--mut); margin-top: .45em; }
.alt.alt-p { font-size: .86em; font-weight: 500; margin-top: .4em; opacity: .85; }
.chips { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 12); }
.chip { min-height: calc(var(--f) * 60); padding: calc(var(--u) * 8) calc(var(--u) * 22); display: inline-flex; align-items: center; font-weight: 600; font-size: calc(var(--f) * 26); border-radius: calc(var(--u) * 4); background: var(--chip); color: var(--chipfg); }
.chip:first-child { background: var(--btn); color: var(--btnfg); }

.t-cover, .t-photo { justify-content: flex-end; }
.has-inset .t-cover { justify-content: flex-start; }
.land.has-inset .t-cover { justify-content: center; }

.rows { display: flex; flex-direction: column; }
.rw { display: grid; grid-template-columns: calc(var(--u) * 150) 1fr; gap: calc(var(--u) * 26); align-items: center; padding: calc(var(--f) * 15) 0; border-top: 1px solid var(--line); }
.rw:last-child { border-bottom: 1px solid var(--line); }
.dbox b { display: block; font-weight: 800; font-size: calc(var(--f) * 74); line-height: .95; letter-spacing: -.04em; }
.dbox span { font: 700 calc(var(--f) * 17) "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .1em; color: var(--mut); }
.wk { font: 700 calc(var(--f) * 17) "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .12em; color: var(--acc2); }
.lbl { font-weight: 800; font-size: calc(var(--f) * 36); line-height: 1.1; letter-spacing: -.015em; margin-top: calc(var(--u) * 4); }
.note { font-size: calc(var(--f) * 22); color: var(--mut); margin-top: calc(var(--u) * 6); font-weight: 500; }
.land .rows { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * 18); }
.land .rw, .land .rw:last-child { grid-template-columns: 1fr; gap: calc(var(--u) * 10); border: 1px solid var(--line); background: var(--card); padding: calc(var(--u) * 22); border-radius: calc(var(--u) * 6); align-content: start; align-items: start; }

.t-day .big { font-weight: 800; font-size: calc(var(--f) * 230); line-height: .8; letter-spacing: -.06em; color: var(--acc); }
.dayhead { display: flex; align-items: flex-end; gap: calc(var(--u) * 26); }
.dayhead .meta { display: flex; flex-direction: column; gap: calc(var(--u) * 6); padding-bottom: calc(var(--u) * 6); font: 700 calc(var(--f) * 24) "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .1em; }
.dayhead .meta span + span { color: var(--mut); }
.dcol { display: flex; flex-direction: column; gap: calc(var(--u) * 26); }
.sess { display: flex; flex-direction: column; }
.se { display: grid; grid-template-columns: calc(var(--u) * 132) 1fr; gap: calc(var(--u) * 18); padding: calc(var(--f) * 16) 0; border-top: 1px solid var(--line); align-items: baseline; }
.se .tm { font: 700 calc(var(--f) * 24) "JetBrains Mono", monospace; color: var(--acc2); }
.se .st { font-weight: 700; font-size: calc(var(--f) * 30); line-height: 1.2; }
.land .t-day { flex-direction: row; align-items: center; gap: calc(var(--u) * 64); }
.land .t-day > * { flex: 1; min-width: 0; }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 16); }
.cd { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: calc(var(--u) * 6); padding: calc(var(--f) * 28); display: flex; flex-direction: column; gap: calc(var(--f) * 10); }
.cd .px { position: absolute; top: 0; right: 0; width: calc(var(--u) * 24); height: calc(var(--u) * 24); border-top-right-radius: calc(var(--u) * 6); }
.cd .when { font: 700 calc(var(--f) * 17) "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .1em; color: var(--acc2); }
.cd h3 { font-weight: 800; font-size: calc(var(--f) * 36); line-height: 1.08; letter-spacing: -.02em; }
.cd p { font-size: calc(var(--f) * 22); line-height: 1.42; color: var(--mut); font-weight: 500; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--f) * 34) calc(var(--u) * 28); }
.land .stats { grid-template-columns: repeat(3, 1fr); }
.st-i { border-top: calc(var(--u) * 5) solid var(--tone); padding-top: calc(var(--f) * 18); }
.st-i b { display: block; font-weight: 800; font-size: calc(var(--f) * 100); line-height: 1; letter-spacing: -.045em; color: var(--tone); }
.th-paper .st-i b, .th-volt .st-i b { color: var(--fg); }
.st-i .l { font-weight: 800; font-size: calc(var(--f) * 28); margin-top: calc(var(--u) * 8); }
.st-i .s { font-size: calc(var(--f) * 20); color: var(--mut); margin-top: calc(var(--u) * 4); font-weight: 500; }

.people { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--f) * 30) calc(var(--u) * 26); }
.land .people { grid-template-columns: repeat(3, 1fr); }
.pp { display: flex; gap: calc(var(--u) * 20); align-items: center; min-width: 0; }
.av { width: calc(var(--f) * 120); height: calc(var(--f) * 120); border-radius: 50%; flex: none; display: grid; place-items: center; overflow: hidden; font-weight: 800; font-size: calc(var(--f) * 40); color: #010d58; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.pp .nm { font-weight: 800; font-size: calc(var(--f) * 29); line-height: 1.15; }
.pp .rl { font-size: calc(var(--f) * 20); color: var(--mut); margin-top: calc(var(--u) * 4); font-weight: 500; }

.logos { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 16); }
.land .logos { grid-template-columns: repeat(4, 1fr); }
.lg { position: relative; height: calc(var(--f) * 170); border-radius: calc(var(--u) * 6); display: grid; place-items: center; border: 1px solid var(--line); background: #010d58; }
.lg.light { background: #fff; }
.lg img { position: absolute; left: 14%; right: 14%; top: 18%; bottom: 18%; width: 72%; height: 64%; object-fit: contain; display: block; }
.lg .ini { font-weight: 800; font-size: calc(var(--f) * 64); color: #fff; }
.lg.light .ini { color: #010d58; }
.lgn { font-weight: 700; font-size: calc(var(--f) * 22); margin-top: calc(var(--u) * 10); }
.lga { font-size: calc(var(--f) * 18); color: var(--mut); margin-top: calc(var(--u) * 2); line-height: 1.35; }

.t-cta { justify-content: center; }
.ctarow { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 14); }
.cbtn, .csite { min-height: calc(var(--f) * 80); padding: calc(var(--u) * 10) calc(var(--u) * 32); display: inline-flex; align-items: center; gap: calc(var(--u) * 14); border-radius: calc(var(--u) * 4); font-weight: 700; font-size: calc(var(--f) * 29); }
.cbtn { background: var(--btn); color: var(--btnfg); }
.csite { border: calc(var(--u) * 2) solid var(--btn); color: var(--fg); }
.th-volt .csite { border-color: var(--fg); }
.cbtn svg, .csite svg { width: calc(var(--f) * 30); height: calc(var(--f) * 30); flex: none; }
.bigtag { font: 700 calc(var(--f) * 38) "JetBrains Mono", monospace; color: var(--acc2); letter-spacing: .02em; }

/* ═════════════ design: Bauhaus — Geologica, a frieze of geometric tiles across the top, solid colour blocks ═════════════ */

  <div class="sp"></div>

  </div>
</div>
<div class="warn" id="warn"></div>

<div class="main">

    <h3>Start from a template</h3>

// Seam blocks: pixel clusters that sit across every slide boundary, so swiping shows one continuous design.
function seam(i, n, W, H, u) {

  for (let k = 1; k < n; k++) {

  blocks.push([n * W - s / 2, H * 0.82, s / 2, s, "lime"], [n * W - s, H * 0.82 + s / 2, s / 2, s / 2, "blue"]);

    .map(([x, y, w, h, c]) => `<i style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;width:${w.toFixed(1)}px;height:${h.toFixed(1)}px;background:var(--c-${c});box-shadow:0 0 ${(40 * u).toFixed(0)}px color-mix(in srgb, var(--c-${c}) 45%, transparent)"></i>`).join("");

// Bauhaus: a frieze of square tiles (circles, halves, quarters, triangles, stripes, dots) across the whole carousel
function renderBau(c) {
  const T = 220 * c.u, r = rng(71), Q = ["var(--q1)", "var(--q2)", "var(--q3)", "var(--q4)", "var(--bg)"];
  const tiles = [];
  for (let t = 0, x = 0; x < c.n * c.W; t++, x = t * T) {
    const b = Math.floor(r() * 5), f = (b + 1 + Math.floor(r() * 4)) % 5, kind = Math.floor(r() * 7), rot = Math.floor(r() * 4) * 90;
    if (x + T < c.i * c.W || x > (c.i + 1) * c.W) continue;

      `<path d="M${x} ${h}A${h} ${h} 0 0 0 ${x + T} ${h}Z" ${fill}/>`,
      `<path d="M${x} ${T}V0A${T} ${T} 0 0 1 ${x + T} ${T}Z" ${fill}/>`,
      `<path d="M${x} ${T}L${cx} 0L${x + T} ${T}Z" ${fill}/>`,

// Neon: stars, a striped sun sitting on every other seam, and a perspective grid floor whose lines meet at the seams
function renderNeon(c) {

    const x = r() * L, y = r() * hz * 0.78, rad = (0.8 + r() * 2.2) * u, o = 0.2 + r() * 0.6;

  }

    .filter((x) => x > lo && x < hi);

  const sun = suns.map((x) => `<circle cx="${x}" cy="${hz}" r="${R}" style="fill:url(#${id}g)" mask="url(#${id}m)"/>`).join("");
  let grid = "";
  for (let k = 1; k <= 9; k++) { const y = hz + (H - hz) * (k / 9) ** 1.7; grid += `<line x1="${lo}" y1="${y.toFixed(1)}" x2="${hi}" y2="${y.toFixed(1)}"/>`; }
  for (let sI = Math.max(0, i - 1); sI <= Math.min(n - 1, i + 1); sI++) {
    const cx = (sI + 0.5) * W, a = sI * W, b = a + W;

      grid += `<line x1="${cx}" y1="${hz}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}"/>`;
    }
  }

      <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sun1)"/><stop offset="1" style="stop-color:var(--sun2)"/></linearGradient>

    ${stars}${sun}<rect x="0" y="${hz}" width="${L}" height="${H - hz}" style="fill:url(#${id}f)"/>

  return {
    back: wide("nn-sky", c, svg) + `<div class="nn-hz"></div>`,
    front: "",
    top: `<div class="s-top"><img src="${LOGO_DARK}" ${LOGO_ALT}><span class="yr">2026</span><span class="no"><b>${c.no}</b> / ${c.tot}</span></div>`,
    foot: `<div class="s-foot"><span>${c.handle}</span>${c.swipe}</div>`,
  };
}
// Waves: layered sine waves computed along the whole carousel, so every slide edge lines up
function renderWave(c) {

    <path d="${wave(H - 266 * u, 30 * u, 1.7 * W, 0, 14 * u, 0.75 * W, 1.3)}" style="fill:var(--w1);opacity:.55"/>
    <path d="${wave(H - 196 * u, 26 * u, 1.3 * W, 2.2, 12 * u, 0.6 * W, 0.4)}" style="fill:var(--w2)"/>

const STAR = (() => { const p = []; for (let t = 0; t < 24; t++) { const a = (t * Math.PI) / 12, rr = t % 2 ? 34 : 48; p.push(`${(Math.cos(a) * rr).toFixed(1)},${(Math.sin(a) * rr).toFixed(1)}`); } return p.join(" "); })();

function slideHTML(sl, i, n) {

  const t = TYPES[sl.type];
  const mode = sl.photo && t.photo ? sl.photoMode || t.photo : "";
  const D = DESIGNS[S.design] || DESIGNS.pixel;
  const cls = ["slide", "ds-" + S.design, "th-" + S.theme, shape, mode === "inset" ? "has-inset" : ""].join(" ");
  const last = i >= n - 1;
  const c = { sl, i, n, W, H, u, last, no: String(i + 1).padStart(2, "0"), tot: String(n).padStart(2, "0"),
    logo: DARK[S.theme] ? LOGO_DARK : LOGO_LIGHT,
    handle: esc([S.handle, S.hashtag].filter(Boolean).join("  ·  ")),
    swipe: `<span class="swipe">${last ? "" : `${esc(SWIPE[langs()[0]])} ${ARROW}`}</span>` };
  const p = D.render(c);
  return `<div class="${cls}" data-i="${i}" style="--w:${W}px;--h:${H}px;--u:${u}px;--k:1">
    ${p.back}
    ${mode ? `<div class="ph ph-${mode}"><img src="${esc(imgUrl(sl.photo))}" alt=""></div>` : ""}
    ${p.front}${p.top}
    <div class="s-body t-${sl.type}">${BODY[sl.type](sl)}</div>

  </div>`;
}

// shrink --k on each slide until its copy fits (long Mongolian words, bilingual mode)
function fit(root) {
  root.querySelectorAll(".slide").forEach((el) => {
    const b = el.querySelector(".s-body");
    let k = 1;
    el.style.setProperty("--k", "1");
    while ((b.scrollHeight > b.clientHeight + 1 || b.scrollWidth > b.clientWidth + 1) && k > 0.5) {
      k -= 0.03;
      el.style.setProperty("--k", k.toFixed(2));

}

// upload → downscaled JPEG/PNG data URL, so saved projects stay small
function pickImage(maxSide, cb) {
  const inp = h("input", { type: "file", accept: "image/*" });
  inp.onchange = () => {
    const file = inp.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = h("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const data = c.toDataURL(/png|svg/.test(file.type) ? "image/png" : "image/jpeg", 0.9);
      if (!SERVER) return cb(data);
      api("upload", { method: "POST", headers: JSONH, body: JSON.stringify({ data }) }).then((r) => cb(r.path), () => cb(data));
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(file);

}

// renders the deck at full size off-screen (no preview scaling) and returns one image per slide

  }

}

}

}
$("bPng").onclick = () => run(async () => { const [img] = await captureAll(S.lang, "png", S.sel); download(img.data, fname(S.lang, S.sel) + ".png"); });
$("bZip").onclick = () => run(async () => { const b = await zipOf([S.lang]); const u = URL.createObjectURL(b); download(u, fname(S.lang) + ".zip"); setTimeout(() => URL.revokeObjectURL(u), 4000); });
$("bBoth").onclick = () => run(async () => { const b = await zipOf(["en", "mn"]); const u = URL.createObjectURL(b); download(u, `ubbw2026-${S.platform}-${S.format.replace(":", "x")}-en-mn.zip`); setTimeout(() => URL.revokeObjectURL(u), 4000); });
function pdfOf(imgs) {
  const { W, H } = dims();
  const pdf = new jspdf.jsPDF({ orientation: "p", unit: "px", format: [W, H], hotfixes: ["px_scaling"], compress: true });
  imgs.forEach(({ data }, k) => { if (k) pdf.addPage([W, H], "p"); pdf.addImage(data, "JPEG", 0, 0, W, H); });
  return pdf;
}
// EN + MN PNG sets (plus the bilingual set when that's the current language), a PDF and captions, written by the server
$("bFolder").onclick = () => run(async () => {
  if (!SERVER) throw new Error("needs the local server (npm run carousel)");
  const files = [];
  const sets = ["en", "mn", ...(S.lang.length > 2 ? [S.lang] : [])];
  for (const lang of sets) {
    for (const { i, data } of await captureAll(lang)) files.push({ name: `${lang}/${fname(lang, i)}.png`, base64: data.split(",")[1] });
    if (LANGS[lang].length === 1 && S.caption[lang]) files.push({ name: `${lang}/caption.txt`, text: S.caption[lang] });
  }
  files.push({ name: fname(S.lang) + ".pdf", base64: pdfOf(await captureAll(S.lang, "jpeg")).output("datauristring").split(",")[1] });
  busy("Writing files…");
  const r = await api("export/" + encodeURIComponent(PROJ), { method: "POST", headers: JSONH, body: JSON.stringify({ files }) });
  return `Saved ${r.count} files → ${r.dir}`;
});
$("bPdf").onclick = () => run(async () => {
  pdfOf(await captureAll(S.lang, "jpeg")).save(fname(S.lang) + ".pdf");
});

/* ───────────────────────── boot ───────────────────────── */
function renderAll() {
  renderBar(); renderList(); renderInspector(); renderStage();
  $("handle").value = S.handle; $("hashtag").value = S.hashtag; $("seamless").checked = !!S.seamless; $("zoom").value = S.zoom;
  $("capEn").value = S.caption?.en || ""; $("capMn").value = S.caption?.mn || ""; counters();
}
// navy copy of the white logo for the light themes (same-origin canvas, so it exports cleanly)
function tintLogo() {
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
        const x = c.getContext("2d"); x.drawImage(img, 0, 0); x.globalCompositeOperation = "source-in"; x.fillStyle = "#010d58"; x.fillRect(0, 0, c.width, c.height);
        LOGO_LIGHT = c.toDataURL("image/png");
      } catch { /* opened from file:// — keep the white logo */ }
      res();
    };
    img.onerror = res;
    img.src = LOGO_DARK;
  });
}
if (location.protocol === "file:") busy("Opened from a file: preview works, but export needs the local server (node scripts/carousel/serve.mjs)", 9000);
renderAll();
connect();
Promise.all([document.fonts.ready, tintLogo()]).then(renderStage);
document.fonts.addEventListener("loadingdone", () => fit($("strip")));
